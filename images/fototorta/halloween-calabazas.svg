<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="skyGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3D1A54"/>
      <stop offset="65%" stop-color="#1A092A"/>
      <stop offset="100%" stop-color="#0A0312"/>
    </radialGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF9D2"/>
      <stop offset="60%" stop-color="#FDE873"/>
      <stop offset="100%" stop-color="#F5B041" stop-opacity="0.1"/>
    </radialGradient>
    <linearGradient id="pumpkinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9E2C"/>
      <stop offset="50%" stop-color="#F36B08"/>
      <stop offset="100%" stop-color="#C94A00"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fondo Circular para Lámina Comestible -->
  <circle cx="250" cy="250" r="240" fill="url(#skyGrad)" stroke="#FF7518" stroke-width="6"/>

  <!-- Luna Llena con Brillo -->
  <circle cx="250" cy="180" r="110" fill="url(#moonGlow)" filter="url(#glow)"/>

  <!-- Estrellas titilantes -->
  <circle cx="90" cy="110" r="3" fill="#FFF8DC" opacity="0.8"/>
  <circle cx="150" cy="70" r="2" fill="#FFF8DC" opacity="0.9"/>
  <circle cx="360" cy="90" r="3.5" fill="#FFF8DC" opacity="0.85"/>
  <circle cx="410" cy="140" r="2.5" fill="#FFF8DC" opacity="0.7"/>
  <circle cx="100" cy="220" r="2" fill="#FFF8DC" opacity="0.8"/>
  <circle cx="400" cy="250" r="2" fill="#FFF8DC" opacity="0.6"/>

  <!-- Siluetas de Murciélagos -->
  <path d="M190 120 C185 110, 175 112, 170 120 C165 112, 155 110, 150 120 C160 125, 168 123, 170 128 C172 123, 180 125, 190 120 Z" fill="#1A092A"/>
  <path d="M330 140 C325 132, 317 134, 313 140 C309 134, 301 132, 296 140 C305 144, 311 142, 313 146 C315 142, 321 144, 330 140 Z" fill="#1A092A"/>
  <path d="M250 90 C246 84, 239 85, 235 90 C231 85, 224 84, 220 90 C228 93, 233 92, 235 95 C237 92, 242 93, 250 90 Z" fill="#1A092A"/>

  <!-- Silueta de Colina Inferior -->
  <path d="M20 370 Q130 310, 250 330 T480 370 L480 490 L20 490 Z" fill="#150820"/>

  <!-- Gran Calabaza de Halloween (Jack O Lantern) -->
  <!-- Tallo -->
  <path d="M245 270 C242 245, 258 238, 265 235 C263 245, 252 255, 251 270 Z" fill="#4E7C27"/>
  <!-- Cuerpo Calabaza -->
  <ellipse cx="250" cy="350" rx="125" ry="95" fill="url(#pumpkinGrad)"/>
  <ellipse cx="210" cy="350" rx="90" ry="92" fill="#E85D04" opacity="0.35"/>
  <ellipse cx="290" cy="350" rx="90" ry="92" fill="#E85D04" opacity="0.35"/>
  <ellipse cx="250" cy="350" rx="60" ry="94" fill="#FFAA33" opacity="0.25"/>

  <!-- Cara Iluminada (Ojos, Nariz, Boca) con Brillo Amarillo -->
  <!-- Ojo Izquierdo -->
  <polygon points="195,315 225,325 210,345" fill="#FFE853" filter="url(#glow)"/>
  <polygon points="195,315 225,325 210,345" fill="#FFFDD0"/>
  <!-- Ojo Derecho -->
  <polygon points="305,315 275,325 290,345" fill="#FFE853" filter="url(#glow)"/>
  <polygon points="305,315 275,325 290,345" fill="#FFFDD0"/>
  <!-- Nariz triangular -->
  <polygon points="250,338 240,358 260,358" fill="#FFE853" filter="url(#glow)"/>
  <polygon points="250,338 240,358 260,358" fill="#FFFDD0"/>
  <!-- Boca sonriente dentada -->
  <path d="M185 375 Q250 420, 315 375 Q295 385, 285 375 L280 382 L268 376 L262 384 L250 377 L238 384 L232 376 L220 382 L215 375 Q205 385, 185 375 Z" fill="#FFE853" filter="url(#glow)"/>
  <path d="M185 375 Q250 420, 315 375 Q295 385, 285 375 L280 382 L268 376 L262 384 L250 377 L238 384 L232 376 L220 382 L215 375 Q205 385, 185 375 Z" fill="#FFFDD0"/>

  <!-- Cartel / Texto Comestible -->
  <text x="250" y="455" font-family="'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" text-anchor="middle" fill="#FFC107" letter-spacing="3" stroke="#2E1C14" stroke-width="1.5">
    ¡HALLOWEEN!
  </text>
  <text x="250" y="478" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#FFF" letter-spacing="1">
    DULCE O TRUCO 🎃
  </text>
</svg>
