    <path d="M20 20 L50 50 M80 20 L50 50 M20 80 L50 50 M80 80 L50 50" stroke="#FFF" stroke-width="1.5" opacity="0.6"/>
    <circle cx="50" cy="50" r="10" stroke="#FFF" stroke-width="1.5" fill="none" opacity="0.6"/>
    <circle cx="50" cy="50" r="22" stroke="#FFF" stroke-width="1.5" fill="none" opacity="0.6"/>
    <!-- Araña -->
    <circle cx="58" cy="56" r="6" fill="#1F132B"/>
    <line x1="58" y1="56" x2="68" y2="50" stroke="#1F132B" stroke-width="1.5"/>
    <line x1="58" y1="56" x2="68" y2="62" stroke="#1F132B" stroke-width="1.5"/>
    <line x1="58" y1="56" x2="48" y2="50" stroke="#1F132B" stroke-width="1.5"/>
    <line x1="58" y1="56" x2="48" y2="62" stroke="#1F132B" stroke-width="1.5"/>
  </g>

  <!-- 11. Boo / Trick or Treat -->
  <g transform="translate(265, 295)">
    <circle cx="50" cy="50" r="48" fill="url(#topperBg3)" stroke="#5A3825" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="50" y="48" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" text-anchor="middle" fill="#FFEB3B" letter-spacing="1">
      TRICK
    </text>
    <text x="50" y="66" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#FF5722" letter-spacing="1">
      OR TREAT
    </text>
  </g>

  <!-- 12. Frankenstein Chibi -->
  <g transform="translate(375, 295)">
    <circle cx="50" cy="50" r="48" fill="url(#topperBg4)" stroke="#5A3825" stroke-width="2" stroke-dasharray="4,2"/>
    <rect x="28" y="28" width="44" height="44" rx="10" fill="#81C784"/>
    <path d="M28 36 L34 28 L40 36 L46 28 L52 36 L58 28 L64 36 L72 28 L72 38 L28 38 Z" fill="#212121"/>
    <circle cx="40" cy="48" r="3.5" fill="#212121"/>
    <circle cx="60" cy="48" r="3.5" fill="#212121"/>
    <line x1="42" y1="62" x2="58" y2="62" stroke="#212121" stroke-width="2"/>
    <line x1="46" y1="59" x2="46" y2="65" stroke="#212121" stroke-width="1.5"/>
    <line x1="54" y1="59" x2="54" y2="65" stroke="#212121" stroke-width="1.5"/>
    <!-- Tornillo -->
    <rect x="22" y="48" width="6" height="4" fill="#9E9E9E"/>
    <rect x="72" y="48" width="6" height="4" fill="#9E9E9E"/>
  </g>

  <!-- Pie explicativo -->
  <rect x="40" y="415" width="420" height="60" rx="12" fill="#FFF3E0" stroke="#FFB74D" stroke-width="1.5"/>
  <text x="250" y="440" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#E65100">
    ¡Impresos en Papel de Arroz Comestible con Tinta Vegetal!
  </text>
  <text x="250" y="460" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#795548">
    Listos para recortar y colocar en cupcakes, galletitas o alfajores.
  </text>
</svg>
