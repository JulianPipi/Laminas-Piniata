  <!-- Fondo Hoja Rectangular A4 de Toppers -->
  <rect width="500" height="500" fill="#FFFDF8" stroke="#5A3825" stroke-width="4" rx="16"/>

  <text x="250" y="42" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" text-anchor="middle" fill="#5A3825" letter-spacing="2">
    🎃 MINI TOPPERS HALLOWEEN 👻
  </text>
  <text x="250" y="65" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#888">
    Círculos comestibles de 5 cm para cupcakes y alfajores
  </text>

  <!-- FILA 1 -->
  <!-- 1. Calabacita -->
  <g transform="translate(45, 85)">
    <circle cx="50" cy="50" r="48" fill="url(#topperBg1)" stroke="#5A3825" stroke-width="2" stroke-dasharray="4,2"/>
    <ellipse cx="50" cy="54" rx="30" ry="24" fill="#FFA726"/>
    <polygon points="40,46 48,50 44,56" fill="#1A092A"/>
    <polygon points="60,46 52,50 56,56" fill="#1A092A"/>
    <polygon points="50,54 47,59 53,59" fill="#1A092A"/>
    <path d="M38 64 Q50 76, 62 64 Z" fill="#1A092A"/>
    <rect x="47" y="26" width="6" height="8" rx="2" fill="#388E3C"/>
  </g>

  <!-- 2. Fantasmita -->
  <g transform="translate(155, 85)">
    <circle cx="50" cy="50" r="48" fill="url(#topperBg2)" stroke="#5A3825" stroke-width="2" stroke-dasharray="4,2"/>
    <path d="M50 25 C32 25, 28 50, 28 65 C28 75, 34 72, 40 76 C46 72, 54 76, 60 72 C66 76, 72 65, 72 65 C72 50, 68 25, 50 25 Z" fill="#FFFFFF"/>
    <circle cx="43" cy="46" r="3.5" fill="#1A092A"/>
    <circle cx="57" cy="46" r="3.5" fill="#1A092A"/>
    <ellipse cx="50" cy="55" rx="3" ry="5" fill="#1A092A"/>
    <circle cx="38" cy="52" r="3" fill="#FF80AB" opacity="0.6"/>
    <circle cx="62" cy="52" r="3" fill="#FF80AB" opacity="0.6"/>
  </g>

  <!-- 3. Murciélago -->
  <g transform="translate(265, 85)">
    <circle cx="50" cy="50" r="48" fill="url(#topperBg1)" stroke="#5A3825" stroke-width="2" stroke-dasharray="4,2"/>
    <path d="M50 40 C44 32, 34 34, 28 40 C30 52, 42 50, 46 58 C48 50, 52 50, 54 58 C58 50, 70 52, 72 40 C66 34, 56 32, 50 40 Z" fill="#212121"/>
    <circle cx="48" cy="45" r="1.5" fill="#FFEB3B"/>
    <circle cx="52" cy="45" r="1.5" fill="#FFEB3B"/>
  </g>

  <!-- 4. Sombrero de Bruja -->
  <g transform="translate(375, 85)">
    <circle cx="50" cy="50" r="48" fill="url(#topperBg2)" stroke="#5A3825" stroke-width="2" stroke-dasharray="4,2"/>
    <polygon points="50,22 34,60 66,60" fill="#212121"/>
    <ellipse cx="50" cy="62" rx="32" ry="7" fill="#212121"/>
    <rect x="36" y="55" width="28" height="5" fill="#FF5722"/>
    <rect x="47" y="53" width="6" height="8" rx="1" fill="#FFD54F"/>
