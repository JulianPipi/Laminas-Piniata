<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="topperBg1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF9E2C"/>
      <stop offset="100%" stop-color="#E65100"/>
    </radialGradient>
    <radialGradient id="topperBg2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7B1FA2"/>
      <stop offset="100%" stop-color="#311B92"/>
    </radialGradient>
    <radialGradient id="topperBg3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#263238"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="topperBg4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#43A047"/>
      <stop offset="100%" stop-color="#1B5E20"/>
