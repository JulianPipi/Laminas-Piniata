    <circle cx="50" cy="50" r="48" fill="url(#topperBg1)" stroke="#5A3825" stroke-width="2" stroke-dasharray="4,2"/>
    <!-- Orejas -->
    <polygon points="32,28 40,46 26,44" fill="#1F132B"/>
    <polygon points="68,28 60,46 74,44" fill="#1F132B"/>
    <circle cx="50" cy="50" r="24" fill="#1F132B"/>
    <ellipse cx="41" cy="48" rx="4" ry="6" fill="#FFEB3B"/>
    <ellipse cx="59" cy="48" rx="4" ry="6" fill="#FFEB3B"/>
    <ellipse cx="41" cy="48" rx="1.5" ry="5" fill="#000"/>
    <ellipse cx="59" cy="48" rx="1.5" ry="5" fill="#000"/>
    <polygon points="50,56 47,59 53,59" fill="#FF80AB"/>
    <line x1="28" y1="56" x2="42" y2="58" stroke="#FFF" stroke-width="1"/>
    <line x1="28" y1="60" x2="42" y2="60" stroke="#FFF" stroke-width="1"/>
    <line x1="72" y1="56" x2="58" y2="58" stroke="#FFF" stroke-width="1"/>
    <line x1="72" y1="60" x2="58" y2="60" stroke="#FFF" stroke-width="1"/>
  </g>

  <!-- 8. Caldero Mágico -->
  <g transform="translate(375, 190)">
    <circle cx="50" cy="50" r="48" fill="url(#topperBg2)" stroke="#5A3825" stroke-width="2" stroke-dasharray="4,2"/>
    <ellipse cx="50" cy="60" rx="26" ry="18" fill="#212121"/>
    <ellipse cx="50" cy="48" rx="22" ry="5" fill="#69F0AE"/>
    <circle cx="44" cy="40" r="4" fill="#69F0AE" opacity="0.8"/>
    <circle cx="54" cy="35" r="5" fill="#69F0AE" opacity="0.9"/>
    <circle cx="50" cy="43" r="3" fill="#69F0AE" opacity="0.7"/>
    <line x1="32" y1="72" x2="28" y2="80" stroke="#212121" stroke-width="4" stroke-linecap="round"/>
    <line x1="68" y1="72" x2="72" y2="80" stroke="#212121" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- FILA 3 -->
  <!-- 9. Dulce / Caramelo -->
  <g transform="translate(45, 295)">
    <circle cx="50" cy="50" r="48" fill="url(#topperBg2)" stroke="#5A3825" stroke-width="2" stroke-dasharray="4,2"/>
    <g transform="translate(25, 30)">
