  <g transform="translate(155, 190)">
    <circle cx="50" cy="50" r="48" fill="url(#topperBg4)" stroke="#5A3825" stroke-width="2" stroke-dasharray="4,2"/>
    <ellipse cx="50" cy="46" rx="26" ry="24" fill="#FFFFFF"/>
    <rect x="40" y="60" width="20" height="12" rx="3" fill="#FFFFFF"/>
    <circle cx="41" cy="46" r="6" fill="#1A092A"/>
    <circle cx="59" cy="46" r="6" fill="#1A092A"/>
    <polygon points="50,53 47,59 53,59" fill="#1A092A"/>
    <line x1="45" y1="64" x2="45" y2="70" stroke="#1A092A" stroke-width="2"/>
    <line x1="50" y1="64" x2="50" y2="70" stroke="#1A092A" stroke-width="2"/>
    <line x1="55" y1="64" x2="55" y2="70" stroke="#1A092A" stroke-width="2"/>
  </g>

