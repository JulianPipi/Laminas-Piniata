<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="chocTransferBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2D123D"/>
      <stop offset="100%" stop-color="#14061D"/>
    </radialGradient>
    <pattern id="spiderPattern" width="125" height="125" patternUnits="userSpaceOnUse">
      <!-- Fondo oscuro suave -->
      <rect width="125" height="125" fill="#240E31" stroke="#3E1A54" stroke-width="1"/>
      
      <!-- Telaraña en esquina -->
      <path d="M0 0 L50 50 M0 25 Q25 25 25 0 M0 45 Q45 45 45 0" stroke="#FF7518" stroke-width="1.2" fill="none" opacity="0.4"/>
      
      <!-- Calabacita dorada / naranja -->
      <circle cx="85" cy="40" r="16" fill="#FF7518"/>
      <ellipse cx="85" cy="40" rx="9" ry="15" fill="#FFA726"/>
      <polygon points="80,36 84,38 82,42" fill="#240E31"/>
      <polygon points="90,36 86,38 88,42" fill="#240E31"/>
      <path d="M78 46 Q85 52, 92 46 Z" fill="#240E31"/>
      
      <!-- Murciélago pequeño -->
      <path d="M35 85 C30 78, 20 80, 15 85 C18 94, 28 92, 30 98 C32 92, 42 94, 45 85 C40 80, 30 78, 35 85 Z" fill="#FFEB3B"/>
      
      <!-- Calaverita blanca -->
      <g transform="translate(75, 80) scale(0.7)">
        <ellipse cx="20" cy="18" rx="14" ry="12" fill="#FFFFFF"/>
        <rect x="14" y="24" width="12" height="7" fill="#FFFFFF" rx="2"/>
        <circle cx="15" cy="18" r="3.5" fill="#240E31"/>
        <circle cx="25" cy="18" r="3.5" fill="#240E31"/>
        <line x1="17" y1="26" x2="17" y2="30" stroke="#240E31" stroke-width="1.5"/>
        <line x1="23" y1="26" x2="23" y2="30" stroke="#240E31" stroke-width="1.5"/>
      </g>
    </pattern>
  </defs>

  <!-- Hoja Chocotransfer A4 Simulación -->
  <rect width="500" height="500" fill="url(#chocTransferBg)" stroke="#FF7518" stroke-width="5" rx="14"/>

  <!-- Matriz de Repetición Pattern -->
  <rect x="25" y="75" width="450" height="350" fill="url(#spiderPattern)" stroke="#FFB74D" stroke-width="2" rx="8"/>

  <!-- Encabezado Chocotransfer -->
  <rect x="25" y="16" width="450" height="46" rx="8" fill="#FF7518"/>
  <text x="250" y="45" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" text-anchor="middle" fill="#14061D" letter-spacing="2">
    🍫 HOJA CHOCOTRANSFER HALLOWEEN
  </text>

  <!-- Pie con instrucciones de aplicación -->
  <rect x="25" y="438" width="450" height="46" rx="8" fill="#3E1A54" stroke="#FF7518" stroke-width="1"/>
  <text x="250" y="458" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="#FFD54F">
    Ideal para bombones, paletas de chocolate blanco o negro y tabletas.
  </text>
  <text x="250" y="474" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#E1BEE7">
    El diseño se transfiere nítido al desmoldar el chocolate templado.
  </text>
</svg>
